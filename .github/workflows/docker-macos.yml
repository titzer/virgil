name: Docker on macOS

# Tests x86-64-linux programs in docker on an arm64 macOS host. The arm64 macOS
# runners that GitHub hosts cannot run docker, because they do not support nested
# virtualization, so this needs a self-hosted runner on an Apple silicon machine
# that has docker. It is only started by hand.
on:
  workflow_dispatch:

jobs:
  x86-64-linux-docker:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        run: bash ./ci/macos/build-test-docker.sh
